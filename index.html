<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5960"><title>Documentos IA</title>
<style>
:root{--ink:#172a35;--muted:#73807d;--paper:#fbfaf6;--canvas:#e7e2d9;--petrol:#0b5960;--dark:#063d43;--peach:#efab86;--soft:#f7dfd1;--green:#6d9d86;--line:#ddd9d0}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 8% 5%,#efab8638,transparent 25rem),radial-gradient(circle at 95% 96%,#0b59601c,transparent 30rem),var(--canvas);color:var(--ink);font:14px Arial,sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:24px 14px}.card{width:min(100%,760px);height:min(920px,calc(100vh - 48px));min-height:620px;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);border:1px solid #172a351a;border-radius:26px;box-shadow:0 26px 80px #29363529}.head{display:flex;align-items:center;gap:13px;padding:20px 23px 17px;border-bottom:1px solid #172a3510}.logo{width:42px;height:42px;display:grid;place-items:center;color:#fff;background:var(--petrol);border-radius:13px 13px 13px 4px;box-shadow:4px 5px 0 #efab86b5;font-size:20px}.head h1{font:700 21px Georgia,serif;letter-spacing:-.03em;margin:0}.head p{margin:5px 0 0;color:var(--muted);font-size:10px}.online{width:7px;height:7px;display:inline-block;margin-left:5px;border-radius:50%;background:var(--green)}.privacy{display:flex;gap:8px;align-items:center;padding:8px 23px;color:#54706c;background:#eef3ed;border-bottom:1px solid #6d9d862b;font-size:10px}.privacy b{margin-left:auto;color:var(--petrol);font-size:11px}.body{flex:1;min-height:0;overflow:auto;padding:22px 23px;background:linear-gradient(#fbfaf6eb,#fbfaf6eb),radial-gradient(circle,#efab8628 1px,transparent 1.5px);background-size:auto,15px 15px}.divider{display:flex;align-items:center;gap:12px;color:#9b9d98;font-size:9px;letter-spacing:.18em;margin:1px 0 23px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:var(--line)}.row{display:flex;gap:9px;align-items:flex-end;margin-bottom:17px;animation:rise .2s ease both}.row.user{justify-content:flex-end}.avatar{width:27px;height:27px;flex:0 0 27px;display:grid;place-items:center;color:#fff;background:var(--petrol);border-radius:10px 10px 10px 3px}.bubble{max-width:85%;padding:12px 15px 9px;border-radius:16px;background:#efeee8;line-height:1.5}.user .bubble{color:#fffaf2;background:var(--petrol);border-bottom-right-radius:5px}.bubble small{display:block;margin-top:6px;text-align:right;color:#172a3566;font-size:9px}.user .bubble small{color:#fffaf277}.file{display:flex;align-items:center;gap:8px;width:max-content;max-width:100%;margin:0 0 12px 36px;padding:9px 11px;color:var(--dark);background:var(--soft);border:1px solid #efab86a6;border-radius:11px;font-size:12px}.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pipeline{margin:5px 0 18px 36px;padding:14px;background:#f0eee7;border:1px solid var(--line);border-radius:15px}.pipeline h3{margin:0 0 12px;color:var(--dark);font-size:12px}.step{display:flex;align-items:center;gap:9px;padding:7px 0;color:#8c9691;font-size:11px;border-bottom:1px solid #172a3510}.step:last-child{border-bottom:0}.step i{width:20px;height:20px;display:grid;place-items:center;color:#8c9691;background:#e2e4dc;border-radius:50%;font-style:normal;font-size:10px}.step.active{color:var(--petrol);font-weight:bold}.step.active i{color:#fff;background:var(--petrol);animation:pulse 1s infinite}.step.done{color:#567968}.step.done i{color:#fff;background:var(--green)}.json-card{margin:0 0 18px 36px;padding:12px;background:#17343b;color:#d9eee4;border-radius:13px;font:10px/1.5 monospace}.json-card strong{display:block;margin-bottom:7px;color:var(--peach);font:700 11px Arial}.action{display:flex;align-items:center;gap:10px;margin:0 0 18px 36px;padding:12px;background:var(--soft);border:1px solid #efab86a6;border-radius:14px}.action .icon{width:34px;height:34px;display:grid;place-items:center;flex:0 0 34px;color:#fff;background:var(--petrol);border-radius:10px}.action div:nth-child(2){flex:1;min-width:0}.action strong,.action span{display:block}.action strong{font-size:12px;color:var(--dark)}.action span{margin-top:3px;color:#7d746d;font-size:10px}.action button,.primary{padding:10px 12px;color:#fffaf2;background:var(--petrol);border-radius:9px;font-size:11px;font-weight:bold}.upload-cta{display:flex;align-items:center;gap:10px;margin:0 0 18px 36px;padding:12px;background:#eef3ed;border:1px solid #6d9d864d;border-radius:14px}.upload-cta div:first-child{width:34px;height:34px;display:grid;place-items:center;flex:0 0 34px;color:#fff;background:var(--petrol);border-radius:10px}.upload-cta div:nth-child(2){flex:1}.upload-cta strong,.upload-cta span{display:block}.upload-cta strong{font-size:12px;color:var(--dark)}.upload-cta span{margin-top:3px;color:#6f7c7e;font-size:10px}.upload-cta button{padding:10px 12px;color:#fffaf2;background:var(--petrol);border-radius:9px;font-size:11px;font-weight:bold}.composer-wrap{padding:12px 19px 18px;border-top:1px solid #172a3510}.composer{display:flex;align-items:flex-end;gap:8px;padding:8px;background:#f0eee7;border:1px solid #e2ded4;border-radius:17px}.composer textarea{flex:1;min-width:0;max-height:100px;padding:9px 2px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}.clip,.send{width:37px;height:37px;display:grid;place-items:center;flex:0 0 37px;border-radius:12px}.clip{position:relative;color:#75807d;font-size:19px}.clip input{position:absolute;inset:0;width:100%;opacity:0}.send{color:#fff;background:var(--petrol);font-size:18px}.hint{margin:8px 2px 0;text-align:center;color:#9b9d98;font-size:9px}.modal-bg{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:#172a3566;backdrop-filter:blur(6px);z-index:5}.modal{width:min(100%,440px);max-height:calc(100vh - 30px);overflow:auto;padding:22px;background:var(--paper);border-radius:20px;box-shadow:0 25px 70px #091f253d}.modal h2{margin:0 0 5px;font:700 25px Georgia,serif}.modal p{color:var(--muted);font-size:13px;line-height:1.45}.modal label{display:grid;gap:6px;margin:12px 0;color:#4d5d5b;font-size:11px;font-weight:bold}.modal input{padding:10px;border:1px solid var(--line);border-radius:9px;background:#f3f1ea;outline:0}.canvas-wrap{padding:8px;background:#f1eee6;border:1px solid var(--line);border-radius:12px}.signature{display:block;width:100%;height:180px;background:#fff;border-radius:7px;touch-action:none}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.secondary{padding:10px 12px;background:#eeeae1;color:var(--ink);border-radius:9px;font-size:12px}.check-row{display:flex!important;gap:8px;align-items:center;margin:14px 0!important;font-size:13px!important}.check-row input{accent-color:var(--petrol)}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 0 6px #0b596026}}@media(max-width:640px){.shell{padding:0}.card{height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.head{padding:18px 17px 14px}.privacy{padding:8px 17px}.body{padding:20px 16px 12px}.composer-wrap{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}.file,.pipeline,.json-card,.action,.upload-cta{margin-left:0}.action{gap:7px}.action button{padding:9px 8px}}
</style>
</head>
<body>
<div class="shell"><main class="card"><header class="head"><div class="logo">▣</div><div style="flex:1"><h1>Documentos IA <span class="online"></span></h1><p>Asistente para leer, rellenar y entregar documentos</p></div></header><div class="privacy">▣ <span>Los datos guardados se reutilizan solo tras verificar tu DNI</span><b>Mis datos</b></div><section class="body" id="chat"><div class="divider"><span>HOY</span></div></section><footer class="composer-wrap"><div class="composer"><label class="clip" title="Adjuntar documento">⌕<input id="fileInput" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx"></label><textarea id="textInput" rows="1" placeholder="Escribe: rellena este documento…"></textarea><button class="send" id="sendBtn">↑</button></div><div class="hint">Escribe o usa el clip · PDF, Word y Excel</div></footer></main></div><div id="modalRoot"></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('textInput'),fileInput=document.getElementById('fileInput');let file=null,fields={full_name:localStorage.getItem('doc_name')||'',identity_number:localStorage.getItem('doc_dni')||'',address:localStorage.getItem('doc_address')||'',checkboxes:{}},signatureData='',model={};const time=()=>new Intl.DateTimeFormat('es-PE',{hour:'2-digit',minute:'2-digit'}).format(new Date());function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}function add(role,text){const r=document.createElement('div');r.className='row '+(role==='user'?'user':'');r.innerHTML=(role==='assistant'?'<div class="avatar">✦</div>':'')+'<div class="bubble">'+esc(text)+'<small>'+time()+'</small></div>';chat.append(r);chat.scrollTop=chat.scrollHeight}function wants(s){return /(rellena|rellenar|llenar|completa|completar|documento|formulario|adjunta|adjuntar)/i.test(s)}function pipeline(){const b=document.createElement('div');b.className='pipeline';b.innerHTML='<h3>Proceso inteligente</h3><div class="step active" id="p1"><i>1</i> Leyendo archivo y convirtiendo a PDF…</div><div class="step" id="p2"><i>2</i> Configurando coordenadas y JSON…</div><div class="step" id="p3"><i>3</i> Identificando campos rellenables…</div><div class="step" id="p4"><i>4</i> Listo para completar</div>';chat.append(b);[['p1',500],['p2',1600],['p3',2700],['p4',3800]].forEach(([id,d])=>setTimeout(()=>{let e=document.getElementById(id);if(!e)return;e.classList.remove('active');e.classList.add('done');if(e.nextElementSibling)e.nextElementSibling.classList.add('active')},d));setTimeout(showJson,4000)}function showJson(){model={source_file:file.name,output_format:'pdf',pages:[{page:1,width:595,height:842}],fields:[{key:'full_name',label:'Nombre completo',type:'text',required:true,coordinate:{page:1,x:110,y:690,w:250,h:18}},{key:'identity_number',label:'DNI',type:'text',required:true,coordinate:{page:1,x:110,y:650,w:160,h:18}},{key:'checkbox_accept',label:'Casilla de aceptación',type:'checkbox',coordinate:{page:1,x:75,y:590,w:16,h:16}},{key:'signature',label:'Firma',type:'signature',coordinate:{page:1,x:120,y:120,w:190,h:70}}],signature:{required:true,ask_each_time:true}};add('assistant','El documento ya está escaneado. Identifiqué sus campos y coordenadas. Usaré tus datos guardados y preguntaré solo lo que falte.');askMissing()}function showUploadButton(){const a=document.createElement('div');a.className='upload-cta';a.innerHTML='<div>↑</div><div><strong>Subir documento</strong><span>PDF, Word o Excel</span></div><button>Elegir archivo</button>';a.querySelector('button').onclick=()=>fileInput.click();chat.append(a);chat.scrollTop=chat.scrollHeight}function askMissing(){if(!fields.full_name){add('assistant','Necesito tu nombre completo para continuar.');return}if(!fields.identity_number){add('assistant','Por seguridad, necesito tu DNI para continuar.');return}add('assistant','Tengo tus datos. Confirma la casilla y firma para generar el documento.');const a=document.createElement('div');a.className='action';a.innerHTML='<div class="icon">✓</div><div><strong>Datos preparados</strong><span>Revisar campos y firmar</span></div><button>Continuar</button>';a.querySelector('button').onclick=showSignature;chat.append(a)}function showSignature(){const root=document.getElementById('modalRoot');root.innerHTML='<div class="modal-bg"><section class="modal"><h2>Firma y opciones</h2><p>Dibuja tu firma. No se guarda para futuros documentos.</p><div class="canvas-wrap"><canvas class="signature" id="sig" width="800" height="360"></canvas></div><label class="check-row"><input id="acceptCheck" type="checkbox"> Marcar con X la casilla de aceptación</label><div class="modal-actions"><button class="secondary" id="clearSig">Limpiar</button><button class="primary" id="finish">Rellenar documento</button></div></section></div>';const c=document.getElementById('sig'),ctx=c.getContext('2d');ctx.strokeStyle='#0b5960';ctx.lineWidth=5;ctx.lineCap='round';let drawing=false,pt=e=>{let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};let down=e=>{drawing=true;let p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()},move=e=>{if(!drawing)return;let p=pt(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};['mousedown','touchstart'].forEach(x=>c.addEventListener(x,down,{passive:false}));['mousemove','touchmove'].forEach(x=>c.addEventListener(x,move,{passive:false}));['mouseup','mouseleave','touchend'].forEach(x=>c.addEventListener(x,()=>drawing=false));document.getElementById('clearSig').onclick=()=>ctx.clearRect(0,0,c.width,c.height);document.getElementById('finish').onclick=()=>{signatureData=c.toDataURL('image/png');fields.checkboxes.accept=document.getElementById('acceptCheck').checked;root.innerHTML='';add('assistant','Firma recibida. Superpondré la X en la casilla correcta y colocaré la firma en sus coordenadas.');setTimeout(showDownload,700)}}function showDownload(){const a=document.createElement('div');a.className='action';a.innerHTML='<div class="icon">↓</div><div><strong>Documento rellenado</strong><span>Listo para descargar</span></div><button>Descargar</button>';a.querySelector('button').onclick=downloadResult;chat.append(a)}function downloadResult(){let n=(file?.name||'documento').replace(/\.[^/.]+$/,''),x=fields.checkboxes.accept?'X':'□',sign=signatureData?'<img style="width:190px;height:70px;object-fit:contain" src="'+signatureData+'">':'Firma pendiente',h='<!doctype html><html lang="es"><meta charset="utf-8"><title>'+esc(n)+' rellenado</title><style>body{font-family:Arial;max-width:760px;margin:35px auto;color:#172a35}h1{color:#0b5960}table{width:100%;border-collapse:collapse}td{padding:14px;border-bottom:1px solid #ddd}td:first-child{font-weight:bold;width:35%}.box{font-size:22px}</style><h1>Documento rellenado</h1><p>Archivo: '+esc(file?.name||'documento')+'</p><table><tr><td>Nombre</td><td>'+esc(fields.full_name||'Pendiente')+'</td></tr><tr><td>DNI</td><td>'+esc(fields.identity_number||'Pendiente')+'</td></tr><tr><td>Domicilio</td><td>'+esc(fields.address||'Pendiente')+'</td></tr><tr><td>Aceptación</td><td class="box">'+x+'</td></tr><tr><td>Firma</td><td>'+sign+'</td></tr></table><p>Salida generada por Documentos IA. La integración final conservará la maqueta original.</p></html>',u=URL.createObjectURL(new Blob([h],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=n+'-rellenado.html';a.click();URL.revokeObjectURL(u);add('assistant','Documento descargado correctamente.')}function handle(f){file=f;add('user','Adjunté el archivo “'+f.name+'”.');add('assistant','Recibí el archivo. Lo estoy escaneando y preparando para rellenarlo. No mostraré detalles técnicos; te avisaré cuando esté listo.');pipeline()}fileInput.onchange=e=>e.target.files[0]&&handle(e.target.files[0]);document.getElementById('sendBtn').onclick=()=>{let v=input.value.trim();if(!v)return;input.value='';add('user',v);if(wants(v)){add('assistant','Claro. Adjunta el documento que deseas rellenar.');showUploadButton();}else if(!fields.full_name){fields.full_name=v;localStorage.setItem('doc_name',v);add('assistant','Nombre guardado en este dispositivo. Ahora escribe “rellena este documento”.')}else if(/^dni\b|^d\.n\.i\.?\b/i.test(v)){fields.identity_number=v.replace(/\D/g,'');localStorage.setItem('doc_dni',fields.identity_number);add('assistant','DNI guardado y listo para verificar.')}else add('assistant','Puedes decir “rellena este documento” o adjuntar un archivo con el clip.')};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('sendBtn').click()}};add('assistant',fields.full_name?'Hola, '+fields.full_name+'. ¿Qué documento deseas rellenar?':'Hola. Soy tu asistente para leer, rellenar y entregar documentos. Dime tu nombre completo para comenzar.');if(fields.full_name)showUploadButton();
</script>
</body></html>
